name: Codex Review Monitor

on:
  issue_comment:
    types: [created]

jobs:
  handle-codex-review:
    if: |
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'chatgpt-codex-connector'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Parse Codex comment
        id: parse
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          if echo "$BODY" | grep -qiE "suggestion|issue|problem|fix|error|should|consider|missing|incorrect|bug"; then
            echo "verdict=needs-fixes" >> $GITHUB_OUTPUT
            echo "has_issues=true" >> $GITHUB_OUTPUT
          else
            echo "verdict=approved" >> $GITHUB_OUTPUT
            echo "has_issues=false" >> $GITHUB_OUTPUT
          fi

      - name: Label PR — needs fixes
        if: steps.parse.outputs.verdict == 'needs-fixes'
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = context.issue.number;
            // Add label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              labels: ['codex-needs-fixes']
            });
            // Remove approved label if present
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr_number,
                name: 'codex-approved'
              });
            } catch(e) {}
            // Post summary comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body: '🤖 **Codex оставил замечания.** Адресую feedback и запущу повторное ревью.'
            });

      - name: Label PR — approved
        if: steps.parse.outputs.verdict == 'approved'
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = context.issue.number;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              labels: ['codex-approved']
            });
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr_number,
                name: 'codex-needs-fixes'
              });
            } catch(e) {}
