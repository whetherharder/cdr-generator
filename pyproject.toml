[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdr-generator"
version = "0.1.0"
description = "Synthetic CDR (Call Detail Record) generator for telecom network testing"
readme = "plan.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "jsonschema>=4.0,<5.0",
    "click>=8.0,<9.0",
    "numpy>=1.24,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.0,<6.0",
]

[project.scripts]
cdrgen = "cdr_generator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cdr_generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
